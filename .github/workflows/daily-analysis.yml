name: Daily Stock Analysis

on:
  schedule:
    # 平日 16:30 JST (07:30 UTC) — 東証の大引け後に実行
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        run: python -m kabu_analysis --output reports

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily analysis report $(date +%Y-%m-%d)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

  # GitHub Pagesへレポートを公開 (Settings > Pages > Source: GitHub Actions を一度有効化すると動く)
  deploy-pages:
    needs: analyze
    runs-on: ubuntu-latest
    continue-on-error: true # Pages未有効でも日次分析自体は成功扱いにする
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
